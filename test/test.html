<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urgence+ - Connexion</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    /* Reset et styles de base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Conteneur principal */
    .login-container {
      background-color: #1e1e1e;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* En-tête du login */
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }

    .logo-icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .logo-text h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 5px;
      color: #ff4444;
    }

    .logo-text p {
      font-size: 12px;
      color: #888888;
      letter-spacing: 2px;
    }

    /* Sélecteur de rôle */
    .role-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    .role-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: #2a2a2a;
      color: #ffffff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .role-btn.active {
      background-color: #0078d4;
    }

    .role-btn:not(.active):hover {
      background-color: #333333;
    }

    .role-icon {
      font-size: 16px;
    }

    /* Formulaire */
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 500;
      color: #888888;
      letter-spacing: 1px;
    }

    .form-group input {
      padding: 14px 16px;
      border: none;
      border-radius: 8px;
      background-color: #2a2a2a;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: background-color 0.3s ease;
    }

    .form-group input:focus {
      background-color: #333333;
    }

    .form-group input::placeholder {
      color: #666666;
    }

    /* Champ mot de passe */
    .password-input {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-input input {
      flex: 1;
    }

    .password-toggle {
      position: absolute;
      right: 16px;
      cursor: pointer;
      font-size: 14px;
      color: #666666;
    }

    /* Bouton de connexion */
    .login-btn {
      padding: 14px;
      border: none;
      border-radius: 8px;
      background-color: #2a2a2a;
      color: #ffffff;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .login-btn:hover {
      background-color: #333333;
    }

    /* Pied de formulaire */
    .form-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
    }

    .forgot-password {
      color: #0078d4;
      font-size: 12px;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .forgot-password:hover {
      color: #005a9e;
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #4CAF50;
    }

    .status-icon {
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <!-- En-tête -->
    <div class="login-header">
      <div class="logo">
        <div class="logo-icon">🚨</div>
        <div class="logo-text">
          <h1>Urgence+</h1>
          <p>CENTRALE D'URGENCE</p>
        </div>
      </div>

      <!-- Sélecteur de rôle -->
      <div class="role-selector">
        <button class="role-btn active">
          <span class="role-icon">👤</span>
          <span>Opérateur</span>
        </button>
        <button class="role-btn">
          <span class="role-icon">👁️</span>
          <span>Superviseur</span>
        </button>
      </div>
    </div>

    <!-- Formulaire de connexion -->
    <form class="login-form">
      <div class="form-group">
        <label for="identifiant">IDENTIFIANT</label>
        <input type="email" id="identifiant" placeholder="j_tremblay@urgencetytence.ca" required>
      </div>

      <div class="form-group">
        <label for="mot-de-passe">MOT DE PASSE</label>
        <div class="password-input">
          <input type="password" id="mot-de-passe" placeholder="••••••••••••" required>
          <span class="password-toggle">👁️</span>
        </div>
      </div>

      <button type="submit" class="login-btn">Se connecter</button>

      <div class="form-footer">
        <a href="#" class="forgot-password">Mot de passe oublié ?</a>
        <div class="connection-status">
          <span class="status-icon">🔒</span>
          <span>Connexion sécurisée JWT</span>
        </div>
      </div>
    </form>
  </div>
</body>
</html>
