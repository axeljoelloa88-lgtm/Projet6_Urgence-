<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rapports — Urgence+</title>
  <style>
    :root{
      --bg:      #05101a;
      --panel:   #0d1624;
      --panel2:  #111b2b;
      --border:  #13213f;
      --text:    #e8eeff;
      --muted:   #8ea3c1;
      --accent:  #3ba3ff;
      --success: #2ec48a;
      --warning: #ffbf56;
      --danger:  #f35f5f;
      --grey:    #8b94a6;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh}

    .page{padding:24px}

    /* ── Header ── */
    .page-header{
      display:flex;justify-content:space-between;align-items:center;
      margin-bottom:24px;flex-wrap:wrap;gap:12px;
    }
    .page-header h1{font-size:1.3rem;font-weight:600}
    .page-header p{font-size:.82rem;color:var(--muted);margin-top:3px}

    /* ── Filtres ── */
    .filters-bar{
      display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;
    }
    .filter-input{
      background:var(--panel);border:1px solid var(--border);
      border-radius:10px;padding:9px 14px;font-size:.85rem;
      color:var(--text);outline:none;min-width:200px;
    }
    .filter-input:focus{border-color:var(--accent)}
    .filter-select{
      background:var(--panel);border:1px solid var(--border);
      border-radius:10px;padding:9px 14px;font-size:.85rem;
      color:var(--text);outline:none;cursor:pointer;
    }

    /* ── Table ── */
    .table-panel{
      background:var(--panel);border:1px solid var(--border);
      border-radius:16px;overflow:hidden;
    }
    .table{width:100%;border-collapse:collapse}
    .table th{
      font-size:.7rem;color:var(--muted);text-transform:uppercase;
      letter-spacing:.08em;padding:12px 16px;
      border-bottom:1px solid var(--border);
      text-align:left;font-weight:500;background:var(--panel2);
    }
    .table td{
      padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.03);
      font-size:.85rem;vertical-align:middle;
    }
    .table tr:last-child td{border-bottom:none}
    .table tr:hover td{background:var(--panel2);cursor:pointer}
    .pill{
      padding:2px 9px;border-radius:999px;
      font-size:.72rem;font-weight:600;white-space:nowrap;
    }
    .empty-state{
      text-align:center;padding:48px 20px;
      color:var(--muted);font-style:italic;
    }

    /* ── Boutons ── */
    .btn{
      display:inline-flex;align-items:center;gap:6px;
      border:none;border-radius:999px;padding:9px 18px;
      font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s;
    }
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .btn.primary{background:var(--accent);color:#fff}
    .btn.primary:hover:not(:disabled){background:#2490e8}
    .btn.success{background:var(--success);color:#fff}
    .btn.success:hover:not(:disabled){background:#27a87a}
    .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
    .btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
    .btn.danger{background:transparent;border:1px solid var(--border);color:var(--danger)}
    .btn.sm{padding:5px 12px;font-size:.78rem}

    /* ── Modal ── */
    .modal-overlay{
      position:fixed;inset:0;background:rgba(0,0,0,.65);
      display:none;align-items:center;justify-content:center;
      z-index:9999;padding:20px;
    }
    .modal-overlay.open{display:flex}
    .modal{
      background:#0d1724;border:1px solid var(--border);
      border-radius:20px;width:min(640px,100%);
      max-height:90vh;display:flex;flex-direction:column;
      overflow:hidden;
    }
    .modal-header{
      display:flex;justify-content:space-between;align-items:center;
      padding:18px 24px;border-bottom:1px solid var(--border);
      flex-shrink:0;
    }
    .modal-header h3{font-size:1rem;font-weight:600}
    .modal-close{
      background:transparent;border:none;color:var(--muted);
      font-size:20px;cursor:pointer;padding:4px;
    }
    .modal-close:hover{color:var(--text)}
    .modal-body{padding:24px;overflow-y:auto;flex:1}
    .modal-footer{
      padding:16px 24px;border-top:1px solid var(--border);
      display:flex;justify-content:flex-end;gap:10px;flex-shrink:0;
    }

    /* ── Formulaire ── */
    .form-group{margin-bottom:16px}
    .form-label{
      display:block;font-size:.75rem;color:var(--muted);
      text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;
    }
    .form-input,.form-textarea,.form-select{
      width:100%;background:var(--panel2);
      border:1px solid var(--border);border-radius:10px;
      padding:10px 14px;font-size:.88rem;color:var(--text);
      outline:none;font-family:inherit;transition:border .15s;
    }
    .form-input:focus,.form-textarea:focus,.form-select:focus{
      border-color:var(--accent);
    }
    .form-textarea{resize:vertical;min-height:100px;line-height:1.6}
    .form-readonly{
      background:#070f1a;color:var(--muted);cursor:not-allowed;
    }
    .auto-section{
      background:rgba(59,163,255,.05);border:1px solid rgba(59,163,255,.15);
      border-radius:12px;padding:14px;margin-bottom:18px;
    }
    .auto-section-title{
      font-size:.72rem;color:var(--accent);text-transform:uppercase;
      letter-spacing:.1em;margin-bottom:10px;
    }
    .auto-row{
      display:flex;justify-content:space-between;
      font-size:.82rem;padding:4px 0;
      border-bottom:1px solid rgba(255,255,255,.04);
    }
    .auto-row:last-child{border-bottom:none}
    .auto-key{color:var(--muted)}
    .auto-val{color:var(--text);font-weight:500;text-align:right}
    .section-divider{
      font-size:.72rem;color:var(--muted);text-transform:uppercase;
      letter-spacing:.1em;margin:18px 0 12px;
      display:flex;align-items:center;gap:10px;
    }
    .section-divider::after{
      content:'';flex:1;height:1px;background:var(--border);
    }

    /* ── Modal PDF ── */
    .pdf-preview{
      background:#fff;color:#111;border-radius:10px;
      padding:32px;font-family:Georgia,serif;
      font-size:13px;line-height:1.7;
      max-height:400px;overflow-y:auto;
    }
    .pdf-preview h2{font-size:16px;margin-bottom:4px;color:#111}
    .pdf-preview h3{font-size:13px;margin:14px 0 6px;color:#333;text-transform:uppercase;letter-spacing:.05em}
    .pdf-preview p{margin-bottom:6px;color:#333}
    .pdf-preview .pdf-meta{color:#666;font-size:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #ddd}
    .pdf-preview .pdf-section{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid #eee}
    .pdf-preview .pdf-section:last-child{border-bottom:none}
    .pdf-row{display:flex;gap:8px;margin-bottom:4px}
    .pdf-key{color:#666;min-width:160px;font-size:12px}
    .pdf-val{color:#111;font-weight:500;font-size:12px}
  </style>
</head>
<body>

<div class="page">
  <!-- Header -->
  <div class="page-header">
    <div>
      <h1>📄 Rapports d'intervention</h1>
      <p>Historique et génération des rapports</p>
    </div>
    <button class="btn primary" id="btnNouveauRapport">
      + Nouveau rapport
    </button>
  </div>

  <!-- Filtres -->
  <div class="filters-bar">
    <input class="filter-input" id="searchInput"
      placeholder="🔍 Rechercher par titre ou intervention...">
  </div>

  <!-- Table -->
  <div class="table-panel">
    <table class="table">
      <thead>
        <tr>
          <th>Référence</th>
          <th>Titre</th>
          <th>Intervention</th>
          <th>Auteur</th>
          <th>Date création</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="rapportsTable"></tbody>
    </table>
  </div>
</div>

<!-- ── Modal Nouveau Rapport ── -->
<div class="modal-overlay" id="modalCreer">
  <div class="modal">
    <div class="modal-header">
      <h3>Créer un rapport</h3>
      <button class="modal-close" id="closeModalCreer">✕</button>
    </div>
    <div class="modal-body">

      <!-- Données automatiques -->
      <div class="auto-section">
        <div class="auto-section-title">📋 Données automatiques</div>
        <div id="autoData">
          <div style="color:var(--muted);font-size:.82rem;font-style:italic">
            Sélectionnez une intervention pour voir les données
          </div>
        </div>
      </div>

      <!-- Choisir intervention -->
      <div class="form-group">
        <label class="form-label">Intervention concernée *</label>
        <select class="form-select" id="selectIntervention">
          <option value="">-- Choisir une intervention --</option>
        </select>
      </div>

      <div class="section-divider">Partie manuelle</div>


      <!-- État victime -->
      <div class="form-group">
        <label class="form-label">État trouvé sur place</label>
        <textarea class="form-textarea" id="inputEtat"
          placeholder="Ex: Personne inconsciente, respiration faible..."></textarea>
      </div>

      <!-- Actions effectuées -->
      <div class="form-group">
        <label class="form-label">Actions effectuées</label>
        <textarea class="form-textarea" id="inputActions"
          placeholder="Ex: Premiers soins administrés, stabilisation..."></textarea>
      </div>

      <!-- Résultat -->
      <div class="form-group">
        <label class="form-label">Résultat de l'intervention</label>
        <textarea class="form-textarea" id="inputResultat"
          placeholder="Ex: Transport vers Hôpital Général, dossier clos..."></textarea>
      </div>

      <!-- Notes -->
      <div class="form-group">
        <label class="form-label">Notes supplémentaires</label>
        <textarea class="form-textarea" id="inputNotes"
          placeholder="Toute information complémentaire..."></textarea>
      </div>

    </div>
    <div class="modal-footer">
      <button class="btn ghost" id="cancelCreer">Annuler</button>
      <button class="btn primary" id="btnSauvegarder">💾 Sauvegarder</button>
    </div>
  </div>
</div>

<!-- ── Modal PDF ── -->
<div class="modal-overlay" id="modalPDF">
  <div class="modal">
    <div class="modal-header">
      <h3>Aperçu PDF</h3>
      <button class="modal-close" id="closeModalPDF">✕</button>
    </div>
    <div class="modal-body">
      <div class="pdf-preview" id="pdfPreview"></div>
    </div>
    <div class="modal-footer">
      <button class="btn ghost" id="cancelPDF">Fermer</button>
      <button class="btn success" id="btnTelecharger">⬇ Télécharger PDF</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/rapports.js"></script>
</body>
</html>
