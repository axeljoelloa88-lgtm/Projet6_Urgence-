<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rapports — Urgence+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:      #030810;
      --panel:   #0a1628;
      --panel2:  #0f1e36;
      --border:  rgba(255,255,255,.07);
      --text:    #f1f5f9;
      --muted:   #64748b;
      --accent:  #3b82f6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger:  #ef4444;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      background:var(--bg);color:var(--text);
      font-family:Inter,system-ui,sans-serif;
      min-height:100vh;
      -webkit-font-smoothing:antialiased;
    }

    /* ── Animations ── */
    @keyframes fadeInUp{
      from{opacity:0;transform:translateY(12px)}
      to  {opacity:1;transform:translateY(0)}
    }
    @keyframes scaleIn{
      from{opacity:0;transform:scale(.95)}
      to  {opacity:1;transform:scale(1)}
    }

    .page{padding:24px}

    /* ── Header ── */
    .page-header{
      display:flex;justify-content:space-between;align-items:center;
      margin-bottom:24px;flex-wrap:wrap;gap:12px;
      animation:fadeInUp .4s ease both;
    }
    .page-header h1{
      font-size:1.3rem;font-weight:600;letter-spacing:-.01em;
      display:flex;align-items:center;gap:10px;
    }
    .page-header p{font-size:.82rem;color:var(--muted);margin-top:3px}
    .title-icon{
      width:32px;height:32px;border-radius:9px;
      background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.2);
      display:flex;align-items:center;justify-content:center;
      color:var(--accent);flex-shrink:0;
    }

    /* ── Filtres ── */
    .filters-bar{
      display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;
      animation:fadeInUp .4s .06s ease both;
    }
    .filter-input{
      background:var(--panel);border:1px solid var(--border);
      border-radius:10px;padding:9px 14px;font-size:.85rem;
      color:var(--text);outline:none;min-width:220px;font-family:inherit;
      transition:border-color .2s, box-shadow .2s;
    }
    .filter-input:focus{
      border-color:rgba(59,130,246,.45);
      box-shadow:0 0 0 3px rgba(59,130,246,.09);
    }
    .filter-input::placeholder{color:#1e3a5f}
    .filter-select{
      background:var(--panel);border:1px solid var(--border);
      border-radius:10px;padding:9px 14px;font-size:.85rem;
      color:var(--text);outline:none;cursor:pointer;font-family:inherit;
      transition:border-color .2s;
    }
    .filter-select:focus{border-color:rgba(59,130,246,.45)}

    /* ── Table ── */
    .table-panel{
      background:var(--panel);border:1px solid var(--border);
      border-radius:16px;overflow:hidden;
      animation:fadeInUp .4s .1s ease both;
    }
    .table{width:100%;border-collapse:collapse}
    .table th{
      font-size:.68rem;color:var(--muted);text-transform:uppercase;
      letter-spacing:.08em;padding:12px 16px;
      border-bottom:1px solid var(--border);
      text-align:left;font-weight:500;background:var(--panel2);
    }
    .table td{
      padding:12px 16px;
      border-bottom:1px solid rgba(255,255,255,.03);
      font-size:.85rem;vertical-align:middle;
    }
    .table tr:last-child td{border-bottom:none}
    .table tr:hover td{background:var(--panel2);cursor:pointer}
    .pill{
      padding:2px 9px;border-radius:999px;
      font-size:.7rem;font-weight:600;white-space:nowrap;
    }
    .empty-state{
      text-align:center;padding:52px 20px;
      color:var(--muted);font-size:.9rem;
    }
    .empty-icon{
      width:48px;height:48px;border-radius:14px;
      background:var(--panel2);border:1px solid var(--border);
      display:flex;align-items:center;justify-content:center;
      margin:0 auto 14px;color:var(--muted);
    }

    /* ── Boutons ── */
    .btn{
      display:inline-flex;align-items:center;gap:6px;
      border:none;border-radius:999px;padding:9px 18px;
      font-size:.85rem;font-weight:600;cursor:pointer;
      font-family:inherit;
      transition:all .2s;
    }
    .btn:disabled{opacity:.4;cursor:not-allowed}
    .btn.primary{background:var(--accent);color:#fff}
    .btn.primary:hover:not(:disabled){background:#2563eb}
    .btn.success{background:var(--success);color:#fff}
    .btn.success:hover:not(:disabled){background:#059669}
    .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
    .btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
    .btn.danger{background:transparent;border:1px solid var(--border);color:var(--danger)}
    .btn.danger:hover:not(:disabled){border-color:var(--danger);background:rgba(239,68,68,.07)}
    .btn.sm{padding:5px 12px;font-size:.78rem}

    /* ── Modal ── */
    .modal-overlay{
      position:fixed;inset:0;
      background:rgba(0,0,0,.72);
      backdrop-filter:blur(5px);
      display:none;align-items:center;justify-content:center;
      z-index:9999;padding:20px;
    }
    .modal-overlay.open{display:flex}
    .modal{
      background:var(--panel);border:1px solid var(--border);
      border-radius:20px;width:min(640px,100%);
      max-height:90vh;display:flex;flex-direction:column;overflow:hidden;
      box-shadow:0 32px 80px rgba(0,0,0,.5);
      animation:scaleIn .25s cubic-bezier(.22,1,.36,1) both;
    }
    .modal-header{
      display:flex;justify-content:space-between;align-items:center;
      padding:18px 24px;border-bottom:1px solid var(--border);flex-shrink:0;
    }
    .modal-header h3{font-size:1rem;font-weight:600}
    .modal-close{
      width:32px;height:32px;
      display:flex;align-items:center;justify-content:center;
      background:rgba(255,255,255,.04);
      border:1px solid var(--border);border-radius:8px;
      color:var(--muted);cursor:pointer;
      transition:all .15s;
    }
    .modal-close:hover{color:var(--text);border-color:rgba(255,255,255,.15)}
    .modal-body{padding:24px;overflow-y:auto;flex:1}
    .modal-footer{
      padding:16px 24px;border-top:1px solid var(--border);
      display:flex;justify-content:flex-end;gap:10px;flex-shrink:0;
    }

    /* ── Formulaire modal ── */
    .form-group{margin-bottom:16px}
    .form-label{
      display:block;font-size:.72rem;color:var(--muted);
      text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;font-weight:500;
    }
    .form-input,.form-textarea,.form-select{
      width:100%;background:var(--panel2);
      border:1px solid var(--border);border-radius:10px;
      padding:10px 14px;font-size:.88rem;color:var(--text);
      outline:none;font-family:inherit;
      transition:border-color .2s, box-shadow .2s;
    }
    .form-input:focus,.form-textarea:focus,.form-select:focus{
      border-color:rgba(59,130,246,.45);
      box-shadow:0 0 0 3px rgba(59,130,246,.09);
    }
    .form-textarea{resize:vertical;min-height:100px;line-height:1.6}
    .form-readonly{background:#040c18;color:var(--muted);cursor:not-allowed}

    .auto-section{
      background:rgba(59,163,255,.04);
      border:1px solid rgba(59,163,255,.12);
      border-radius:12px;padding:14px;margin-bottom:18px;
    }
    .auto-section-title{
      font-size:.7rem;color:var(--accent);text-transform:uppercase;
      letter-spacing:.1em;margin-bottom:10px;font-weight:500;
      display:flex;align-items:center;gap:6px;
    }
    .auto-row{
      display:flex;justify-content:space-between;
      font-size:.82rem;padding:4px 0;
      border-bottom:1px solid rgba(255,255,255,.04);
    }
    .auto-row:last-child{border-bottom:none}
    .auto-key{color:var(--muted)}
    .auto-val{color:var(--text);font-weight:500;text-align:right}

    .section-divider{
      font-size:.7rem;color:var(--muted);text-transform:uppercase;
      letter-spacing:.1em;margin:18px 0 12px;
      display:flex;align-items:center;gap:10px;font-weight:500;
    }
    .section-divider::after{content:'';flex:1;height:1px;background:var(--border)}

    /* ── Modal PDF ── */
    .pdf-preview{
      background:#fff;color:#111;border-radius:10px;
      padding:32px;font-family:Georgia,serif;
      font-size:13px;line-height:1.7;
      max-height:400px;overflow-y:auto;
    }
    .pdf-preview h2{font-size:16px;margin-bottom:4px;color:#111}
    .pdf-preview h3{font-size:13px;margin:14px 0 6px;color:#333;text-transform:uppercase;letter-spacing:.05em}
    .pdf-preview p{margin-bottom:6px;color:#333}
    .pdf-preview .pdf-meta{color:#666;font-size:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #ddd}
    .pdf-preview .pdf-section{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid #eee}
    .pdf-preview .pdf-section:last-child{border-bottom:none}
    .pdf-row{display:flex;gap:8px;margin-bottom:4px}
    .pdf-key{color:#666;min-width:160px;font-size:12px}
    .pdf-val{color:#111;font-weight:500;font-size:12px}
  </style>
</head>
<body>

<div class="page">
  <!-- Header -->
  <div class="page-header">
    <div>
      <h1>
        <div class="title-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
        </div>
        Rapports d'intervention
      </h1>
      <p>Historique et génération des rapports</p>
    </div>
    <button class="btn primary" id="btnNouveauRapport">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Nouveau rapport
    </button>
  </div>

  <!-- Filtres -->
  <div class="filters-bar">
    <input class="filter-input" id="searchInput" placeholder="Rechercher par titre ou intervention...">
  </div>

  <!-- Table -->
  <div class="table-panel">
    <table class="table">
      <thead>
        <tr>
          <th>Référence</th>
          <th>Titre</th>
          <th>Intervention</th>
          <th>Auteur</th>
          <th>Date création</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="rapportsTable"></tbody>
    </table>
  </div>
</div>

<!-- ── Modal Nouveau Rapport ── -->
<div class="modal-overlay" id="modalCreer">
  <div class="modal">
    <div class="modal-header">
      <h3>Créer un rapport</h3>
      <button class="modal-close" id="closeModalCreer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">

      <!-- Données automatiques -->
      <div class="auto-section">
        <div class="auto-section-title">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          Données automatiques
        </div>
        <div id="autoData">
          <div style="color:var(--muted);font-size:.82rem;font-style:italic">
            Sélectionnez une intervention pour voir les données
          </div>
        </div>
      </div>

      <!-- Intervention -->
      <div class="form-group">
        <label class="form-label">Intervention concernée *</label>
        <select class="form-select" id="selectIntervention">
          <option value="">-- Choisir une intervention --</option>
        </select>
      </div>

      <div class="section-divider">Partie manuelle</div>

      <div class="form-group">
        <label class="form-label">État trouvé sur place</label>
        <textarea class="form-textarea" id="inputEtat" placeholder="Ex: Personne inconsciente, respiration faible..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Actions effectuées</label>
        <textarea class="form-textarea" id="inputActions" placeholder="Ex: Premiers soins administrés, stabilisation..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Résultat de l'intervention</label>
        <textarea class="form-textarea" id="inputResultat" placeholder="Ex: Transport vers Hôpital Général, dossier clos..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Notes supplémentaires</label>
        <textarea class="form-textarea" id="inputNotes" placeholder="Toute information complémentaire..."></textarea>
      </div>

    </div>
    <div class="modal-footer">
      <button class="btn ghost" id="cancelCreer">Annuler</button>
      <button class="btn primary" id="btnSauvegarder">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        Sauvegarder
      </button>
    </div>
  </div>
</div>

<!-- ── Modal PDF ── -->
<div class="modal-overlay" id="modalPDF">
  <div class="modal">
    <div class="modal-header">
      <h3>Aperçu PDF</h3>
      <button class="modal-close" id="closeModalPDF">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="pdf-preview" id="pdfPreview"></div>
    </div>
    <div class="modal-footer">
      <button class="btn ghost" id="cancelPDF">Fermer</button>
      <button class="btn success" id="btnTelecharger">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Télécharger PDF
      </button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/rapports.js"></script>
</body>
</html>
