<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urgence+ — Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="login-bg">
    <div class="container">

      <header class="header">
        <div class="login-logo">
          <div class="login-logo-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <line x1="12" y1="8" x2="12" y2="16"/>
              <line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
          </div>
          <div>
            <h1>Urgence+</h1>
            <p>Système de gestion des interventions</p>
          </div>
        </div>
      </header>

      <div class="role-buttons">
        <button type="button" class="active" data-role="operateur">Opérateur</button>
        <button type="button" data-role="superviseur">Superviseur</button>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Identifiant</label>
          <input id="email" type="email" placeholder="nom@urgenceplus.fr" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="mot-de-passe">Mot de passe</label>
          <input id="mot-de-passe" type="password" placeholder="••••••••••••" required autocomplete="current-password">
        </div>
        <button class="submit-button" type="submit">Se connecter</button>
        <div class="message" id="login-message"></div>
      </form>

      <div class="footer">
        <div class="footer-dot"></div>
        Connexion sécurisée · Urgence+ v2.0
      </div>

    </div>
  </div>
  <script src="../js/login.js"></script>
</body>
</html>
