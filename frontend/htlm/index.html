<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urgence+ - Connexion</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Urgence+</h1>
      <p>Connexion opérateur / superviseur</p>
    </header>

    <div class="role-buttons">
      <button type="button" class="active" data-role="operateur">Opérateur</button>
      <button type="button" data-role="superviseur">Superviseur</button>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Identifiant</label>
        <input id="email" type="email" placeholder="nom@urgenceplus.fr" required>
      </div>

      <div class="form-group">
        <label for="mot-de-passe">Mot de passe</label>
        <input id="mot-de-passe" type="password" placeholder="••••••••••••" required>
      </div>

      <button class="submit-button" type="submit">Se connecter</button>
      <div class="message" id="login-message"></div>
    </form>

    <div class="footer">
      <span>Connexion sécurisée</span>
    </div>
  </div>
  <script src="../js/login.js"></script>
</body>
</html>
