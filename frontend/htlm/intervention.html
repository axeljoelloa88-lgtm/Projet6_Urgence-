<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fiche Intervention — Urgence+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:      #030810;
      --panel:   #0a1628;
      --panel2:  #0f1e36;
      --border:  rgba(255,255,255,.07);
      --text:    #f1f5f9;
      --muted:   #64748b;
      --accent:  #3b82f6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger:  #ef4444;
      --grey:    #64748b;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      background:var(--bg);color:var(--text);
      font-family:Inter,system-ui,sans-serif;
      min-height:100vh;
      -webkit-font-smoothing:antialiased;
    }

    /* ── Animations ── */
    @keyframes fadeInUp{
      from{opacity:0;transform:translateY(12px)}
      to  {opacity:1;transform:translateY(0)}
    }
    @keyframes fadeInDown{
      from{opacity:0;transform:translateY(-12px)}
      to  {opacity:1;transform:translateY(0)}
    }

    /* ── Topbar ── */
    .topbar{
      display:flex;justify-content:space-between;align-items:center;
      padding:0 24px;height:60px;
      background:var(--panel);
      border-bottom:1px solid var(--border);
      position:sticky;top:0;z-index:100;
      animation:fadeInDown .35s ease both;
    }
    .topbar-left{display:flex;align-items:center;gap:12px}
    .logo{
      width:34px;height:34px;border-radius:10px;
      background:linear-gradient(135deg,#ef4444,#b91c1c);
      display:flex;align-items:center;justify-content:center;
      color:#fff;
      box-shadow:0 4px 12px rgba(239,68,68,.3);
    }
    .topbar h1{font-size:1rem;font-weight:600;letter-spacing:-.01em}
    .topbar p{font-size:.78rem;color:var(--muted);margin-top:2px}
    .int-ref{
      display:inline-block;background:var(--panel2);
      color:var(--accent);border:1px solid var(--border);
      padding:2px 10px;border-radius:6px;font-size:.82rem;
      font-family:monospace;margin-left:10px;
    }
    .btn-back{
      display:flex;align-items:center;gap:6px;
      background:transparent;border:1px solid var(--border);
      color:var(--muted);padding:8px 14px;border-radius:999px;
      cursor:pointer;font-size:.82rem;font-family:inherit;
      transition:all .18s;
    }
    .btn-back:hover{border-color:rgba(59,130,246,.4);color:var(--accent)}

    /* ── Page ── */
    .page{max-width:1100px;margin:0 auto;padding:20px 24px}
    .subtitle{font-size:.82rem;color:var(--muted);margin-top:5px}

    /* ── Stepper ── */
    .stepper{
      display:flex;margin-bottom:24px;
      background:var(--panel);border:1px solid var(--border);
      border-radius:14px;overflow:hidden;
      animation:fadeInUp .4s .05s ease both;
    }
    .tab{
      flex:1;display:flex;align-items:center;justify-content:center;
      gap:8px;padding:13px 8px;font-size:.8rem;color:var(--muted);
      border-right:1px solid var(--border);
      transition:all .2s;
    }
    .tab:last-child{border-right:none}
    .tab.done{background:rgba(16,185,129,.05);color:var(--success)}
    .tab.active{background:rgba(59,130,246,.08);color:var(--accent);font-weight:600}
    .tab-icon{
      width:22px;height:22px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:.75rem;font-weight:700;flex-shrink:0;
      background:var(--panel2);color:var(--muted);
    }
    .tab.done .tab-icon{background:rgba(16,185,129,.1);color:var(--success)}
    .tab.active .tab-icon{background:rgba(59,130,246,.15);color:var(--accent)}

    /* ── Grille ── */
    .grid{display:grid;grid-template-columns:1fr 360px;gap:18px}

    /* ── Cards ── */
    .card{
      background:var(--panel);border:1px solid var(--border);
      border-radius:16px;padding:20px;margin-bottom:16px;
      animation:fadeInUp .4s ease both;
      transition:border-color .2s;
    }
    .card:hover{border-color:rgba(255,255,255,.1)}
    .card:last-child{margin-bottom:0}
    .grid > div:nth-child(1) .card:nth-child(1){animation-delay:.1s}
    .grid > div:nth-child(1) .card:nth-child(2){animation-delay:.15s}
    .grid > div:nth-child(2) .card:nth-child(1){animation-delay:.12s}

    .card-title{
      font-size:.7rem;color:var(--muted);text-transform:uppercase;
      letter-spacing:.12em;margin-bottom:14px;font-weight:500;
    }
    .info-row{
      display:flex;justify-content:space-between;align-items:center;
      padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);
      font-size:.88rem;
    }
    .info-row:last-child{border-bottom:none}
    .info-key{color:var(--muted)}
    .info-val{color:var(--text);font-weight:500;text-align:right;max-width:60%}

    /* ── Actions ── */
    .actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
    .btn{
      display:inline-flex;align-items:center;gap:6px;
      border:none;border-radius:999px;padding:10px 18px;
      font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit;
      transition:all .2s;
    }
    .btn:disabled{opacity:.4;cursor:not-allowed}
    .btn.primary{background:var(--accent);color:#fff}
    .btn.primary:hover:not(:disabled){background:#2563eb}
    .btn.success{background:var(--success);color:#fff}
    .btn.success:hover:not(:disabled){background:#059669}
    .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
    .btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}

    /* ── Timeline ── */
    .timeline{display:flex;flex-direction:column;gap:0}
    .event{
      display:flex;gap:14px;align-items:flex-start;
      padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04);
    }
    .event:last-child{border-bottom:none}
    .event-dot{
      width:32px;height:32px;border-radius:50%;
      background:var(--panel2);border:1px solid var(--border);
      display:flex;align-items:center;justify-content:center;
      flex-shrink:0;margin-top:2px;color:var(--muted);
    }
    .event-body{flex:1}
    .event-title{font-size:.9rem;font-weight:500;margin-bottom:3px}
    .event-detail{font-size:.8rem;color:var(--muted);margin-bottom:3px;line-height:1.5}
    .event-time{font-size:.72rem;color:var(--grey)}

    @media(max-width:820px){
      .grid{grid-template-columns:1fr}
      .stepper{flex-wrap:wrap}
      .tab{min-width:calc(50% - 1px)}
    }
  </style>
</head>
<body>

  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <line x1="12" y1="8" x2="12" y2="16"/>
          <line x1="8" y1="12" x2="16" y2="12"/>
        </svg>
      </div>
      <div>
        <h1>Fiche intervention <span class="int-ref" id="intRef">#INT-0000</span></h1>
        <p id="subtitle" class="subtitle">Chargement...</p>
      </div>
    </div>
    <button id="backBtn" class="btn-back">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
      Retour dispatch
    </button>
  </div>

  <div class="page">

    <!-- Stepper statut -->
    <div class="stepper" id="statusTabs"></div>

    <div class="grid">

      <!-- Colonne gauche -->
      <div>
        <!-- Incident -->
        <div class="card">
          <div class="card-title">Incident</div>
          <div class="info-row">
            <span class="info-key">Type &amp; Priorité</span>
            <span class="info-val" id="typeBadge">—</span>
          </div>
          <div class="info-row">
            <span class="info-key">Adresse</span>
            <span class="info-val" id="adresse">—</span>
          </div>
          <div class="info-row">
            <span class="info-key">Appelant</span>
            <span class="info-val" id="appelant">—</span>
          </div>
          <div class="info-row">
            <span class="info-key">Heure de l'appel</span>
            <span class="info-val" id="heureAppel">—</span>
          </div>
        </div>

        <!-- Journal -->
        <div class="card">
          <div class="card-title">Journal de l'intervention</div>
          <div id="timeline" class="timeline"></div>
        </div>
      </div>

      <!-- Colonne droite -->
      <div>
        <!-- Ressources -->
        <div class="card">
          <div class="card-title">Ressources assignées</div>
          <div class="info-row">
            <span class="info-key">Véhicule</span>
            <span class="info-val" id="vehiculeName">—</span>
          </div>
          <div class="info-row">
            <span class="info-key">Agent</span>
            <span class="info-val" id="agentName">—</span>
          </div>
          <div class="info-row">
            <span class="info-key">Heure affectation</span>
            <span class="info-val" id="affectTime">—</span>
          </div>
          <div class="info-row">
            <span class="info-key">Délai affectation</span>
            <span class="info-val" id="delay">—</span>
          </div>

          <div class="actions">
            <button id="btnOnScene" class="btn primary" style="display:none">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="10" r="3"/>
                <path d="M12 21.7C17.3 17 20 13 20 10a8 8 0 10-16 0c0 3 2.7 6.9 8 11.7z"/>
              </svg>
              Sur place
            </button>
            <button id="btnClose" class="btn success" style="display:none">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
              Clôturer
            </button>
            <button id="btnReport" class="btn ghost" style="display:none">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
              </svg>
              Rapport
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/intervention.js"></script>
</body>
</html>
