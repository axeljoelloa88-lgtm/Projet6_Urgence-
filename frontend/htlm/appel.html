<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urgence+ — Enregistrer un appel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    /* ── Appel page: full-viewport column layout ── */
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── Sticky topbar ── */
    .op-topbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(3,8,16,.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,.07);
      padding: 0 28px;
      height: 60px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
      animation: fadeInDown .4s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0);     }
    }
    .op-topbar-left { display: flex; align-items: center; gap: 12px; }
    .op-logo {
      width: 34px; height: 34px; border-radius: 10px;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 12px rgba(239,68,68,.32);
    }
    .op-app-name {
      display: block; font-size: .9rem; font-weight: 700;
      color: #f1f5f9; letter-spacing: -.01em;
    }
    .op-app-sub {
      display: block; font-size: .65rem; color: #475569;
      text-transform: uppercase; letter-spacing: .1em; margin-top: 1px;
    }

    /* ── Main content ── */
    .op-main {
      flex: 1;
      padding: 32px 28px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }

    /* ── Page title ── */
    .op-title {
      margin-bottom: 28px;
      animation: fadeInUp .4s .05s both;
    }
    .op-title h1 {
      font-size: 1.45rem; font-weight: 700;
      letter-spacing: -.02em; color: #f1f5f9;
      margin-bottom: 4px;
    }
    .op-title p { font-size: .875rem; color: #64748b; }

    /* ── Section wrappers ── */
    .button-group {
      margin-bottom: 22px;
      animation: fadeInUp .4s ease both;
    }
    .button-group:nth-child(1) { animation-delay: .08s; }
    .button-group:nth-child(2) { animation-delay: .14s; }

    /* ── Form animation ── */
    #appel-form { animation: fadeInUp .4s .2s both; }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .op-main { padding: 20px 16px; }
      .op-topbar { padding: 0 16px; }
    }
  </style>
</head>
<body>

  <!-- Topbar opérateur -->
  <header class="op-topbar">
    <div class="op-topbar-left">
      <div class="op-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <line x1="12" y1="8" x2="12" y2="16"/>
          <line x1="8" y1="12" x2="16" y2="12"/>
        </svg>
      </div>
      <div>
        <span class="op-app-name">Urgence+</span>
        <span class="op-app-sub">Console opérateur</span>
      </div>
    </div>
    <div class="header-actions">
      <span id="operateur-nom" class="operateur-nom"></span>
      <button id="logoutBtn" class="logout-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Déconnexion
      </button>
    </div>
  </header>

  <main class="op-main">

    <div class="op-title">
      <h1>Enregistrer un appel</h1>
      <p>Saisissez les informations de l'incident pour créer une intervention.</p>
    </div>

    <!-- Type d'incident -->
    <section class="button-group">
      <label class="section-label">Type d'incident</label>
      <div class="buttons-grid" id="type-buttons">

        <button type="button" class="option-button active" data-value="incendie">
          <span class="btn-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8.5 14.5A2.5 2.5 0 0011 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 11-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 002.5 2.5z"/>
            </svg>
          </span>
          Incendie
        </button>

        <button type="button" class="option-button" data-value="medical">
          <span class="btn-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
            </svg>
          </span>
          Médical
        </button>

        <button type="button" class="option-button" data-value="accident">
          <span class="btn-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
              <line x1="12" y1="9" x2="12" y2="13"/>
              <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
          </span>
          Accident
        </button>

        <button type="button" class="option-button" data-value="autre">
          <span class="btn-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
          </span>
          Autre
        </button>

      </div>
    </section>

    <!-- Priorité -->
    <section class="button-group">
      <label class="section-label">Priorité</label>
      <div class="buttons-grid" id="priority-buttons">
        <button type="button" class="option-button" data-value="faible">Faible</button>
        <button type="button" class="option-button" data-value="moyenne">Moyenne</button>
        <button type="button" class="option-button" data-value="haute">Haute</button>
        <button type="button" class="option-button active" data-value="critique">Critique</button>
      </div>
    </section>

    <!-- Formulaire -->
    <form id="appel-form">
      <div class="flex-row">
        <div class="form-group">
          <label for="appelant_nom">Nom de l'appelant</label>
          <input id="appelant_nom" name="appelant_nom" type="text" placeholder="Marie Lefebvre" required>
        </div>
        <div class="form-group">
          <label for="appelant_tel">Téléphone</label>
          <input id="appelant_tel" name="appelant_tel" type="tel" placeholder="514-555-0192" required>
        </div>
      </div>

      <div class="form-group location-group">
        <label for="adresse">Localisation</label>
        <div class="location-row">
          <input id="adresse" name="adresse" type="text" placeholder="1425 rue Sainte-Catherine, Montréal" required>
          <button type="button" id="geolocate" class="geo-button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="10" r="3"/>
              <path d="M12 21.7C17.3 17 20 13 20 10a8 8 0 10-16 0c0 3 2.7 6.9 8 11.7z"/>
            </svg>
            Géolocaliser
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="description">Description de l'incident</label>
        <textarea id="description" name="description" placeholder="Décrivez la situation avec le plus de détails possible..." required></textarea>
      </div>

      <button class="submit-button" type="submit">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
        Enregistrer et dispatcher
      </button>
      <div class="message" id="appel-message"></div>
    </form>

  </main>

  <!-- Modal carte -->
  <div id="map-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <p style="font-size:.7rem;color:#64748b;text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px">Cartographie</p>
          <h2>Sélectionner la localisation</h2>
        </div>
        <button type="button" class="close-modal" id="close-map">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div id="map" class="map-container"></div>
      <div class="modal-footer">
        <p id="map-coords" class="map-info">Cliquez sur la carte pour définir la localisation.</p>
        <button type="button" id="confirm-location" class="confirm-button">Confirmer la localisation</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="../js/appel.js"></script>
</body>
</html>
